[package]
name = "grs-integration"
version = "0.1.0"
description = "Integración GRS — panel de operador de escritorio"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grs_integration_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Por defecto se sirve el frontend embebido (dist/) = modo producción.
# El "Tauri Development Debug" usa --no-default-features para desactivar
# custom-protocol y cargar el dev server (devUrl: http://localhost:1420).
# NO ELIMINAR: sin custom-protocol, Tauri siempre intenta localhost.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

